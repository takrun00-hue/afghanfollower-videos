name: Daily videos

# Runs in GitHub's cloud — your PC does not need to be on.
on:
  schedule:
    - cron: "30 3 * * *"   # 08:00 Asia/Kabul (UTC+4:30)
  workflow_dispatch:
    inputs:
      only:
        description: "Just one category (tiktok / instagram / tools). Leave empty for all three."
        required: false
        default: ""
      date:
        description: "Build a specific day (YYYY-MM-DD). Leave empty for today."
        required: false
        default: ""

concurrency:
  group: render
  cancel-in-progress: false

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: System packages (ffmpeg + headless Chrome libs)
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg \
            libnss3 libatk1.0-0t64 libatk-bridge2.0-0t64 libcups2t64 libdrm2 \
            libxkbcommon0 libxcomposite1 libxdamage1 libxfixes3 libxrandr2 \
            libgbm1 libasound2t64 libpango-1.0-0 libcairo2 fonts-liberation

      - name: Build, render and send
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          ARGS=""
          if [ -n "${{ github.event.inputs.only }}" ]; then ARGS="$ARGS --only ${{ github.event.inputs.only }}"; fi
          if [ -n "${{ github.event.inputs.date }}" ]; then ARGS="$ARGS ${{ github.event.inputs.date }}"; fi
          echo "running: node daily-render.mjs $ARGS"
          node daily-render.mjs $ARGS

      - name: Keep the MP4s downloadable for a week
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: videos
          path: renders/daily/**/afghanfollower-*.mp4
          retention-days: 7
          if-no-files-found: ignore
