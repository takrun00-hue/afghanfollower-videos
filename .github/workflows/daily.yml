name: Daily GapMedia video delivery

# Runs in GitHub's cloud. The computer may be off.
#
# This used to fire on four exact single-minute crons (30 6/7 * * *, 0 15/16
# * * *) and gate on which one matched. On 2026-09-06 the 08:30 Berlin run
# never fired at all. The fix at the time assumed telegram.yml's much more
# frequent "*/5 * * * *" cron was proof GitHub delivers a frequent schedule
# reliably, and switched this workflow to "*/15 * * * *" polling a 30-minute
# window instead of one exact minute.
#
# That assumption did not hold up. Checked against real run history
# (2026-08-26 through 2026-09-08, both this workflow and telegram.yml):
# neither cron fires anywhere near its configured interval — actual gaps
# between runs range from under an hour to over 30 hours, regardless of
# whether the cron says every 5 minutes or every 15. GitHub's own docs say
# a scheduled run "may be delayed during periods of high load," which in
# practice means a 30-minute window has no real guarantee of ever seeing a
# poll land inside it: of ~40 sampled runs of THIS workflow across 13 days,
# only 2 ever fell inside a delivery window — on 2026-09-06 the morning
# batch was silently missed entirely and only the evening one happened to
# land, at 17:28, two minutes before that window would have closed too.
#
# Two independent fixes, not one:
#   1. The delivery windows below are open-ended (from the threshold time
#      until the next one), not 30 minutes wide, so it no longer matters
#      how late a poll arrives — only that at least one arrives before the
#      next threshold, which the observed gaps satisfy far more often than
#      they satisfy a 30-minute window.
#   2. A trigger this project does not depend on GitHub's own scheduler for
#      pushes a one-line touch to .trigger-daily-dispatch on a real, hourly
#      cron (see the "GapMedia daily.yml reliable dispatch" Routine — ask
#      about it if it needs changing; it is not defined in this repo), which
#      fires this workflow through the `push` trigger below — an ordinary
#      commit, not a workflow-dispatch API call, because the GitHub App
#      connected to this repo has "contents: write" but not "actions: write"
#      (confirmed live 2026-09-08: an actual workflow_dispatch call 403s,
#      "Resource not accessible by integration," on both the MCP tool and a
#      raw REST call; a plain push with the same credential does not). Every
#      push through that path runs through the exact same time+dedup gate as
#      a schedule-triggered run (see the default case below), so it is always
#      safe to fire early, late, or extra — it just no-ops outside a
#      threshold or after today's batch already shipped. An explicit
#      workflow_dispatch with morning/evening/all bypasses the gate, for a
#      manual backfill or test — that one still needs someone with actual
#      Actions access to fire it from the GitHub UI or a CLI with a real PAT.
#
# The schedule trigger stays as a free, harmless second chance — GitHub is
# not reliable, but it is not zero, either.
on:
  schedule:
    - cron: "*/15 * * * *"
  # The reliable trigger this file's header comment describes turned out to
  # need workflow_dispatch permission ("actions: write") on the GitHub App
  # installed for this repo, which it does not have — confirmed live
  # 2026-09-08: the same call 403s identically whether made through the MCP
  # tool or a raw REST POST ("Resource not accessible by integration"), while
  # a plain git push with the exact same credential succeeds every time. So
  # the trigger pushes a one-line touch to this path instead — an ordinary
  # commit, not a workflow API call — which only needs the "contents: write"
  # permission that already works. Scoped to this one path so it does not
  # fire on every unrelated commit to the repo.
  push:
    paths:
      - ".trigger-daily-dispatch"
  workflow_dispatch:
    inputs:
      batch:
        description: "auto = respect the real Berlin time + dedup gate (safe to call anytime); morning/evening/all force that batch immediately, skipping the gate"
        required: true
        default: "auto"
        type: choice
        options:
          - auto
          - morning
          - evening
          - all

# Do not cancel a morning render just because a later poll begins.
concurrency:
  group: gapmedia-scheduled-production
  cancel-in-progress: false

permissions:
  # write, not read: the new "Persist delivery memory to git" step below
  # commits .content-history.json / .content-registry.json / the sent
  # markers after a real send, so the dedup record survives even if the
  # Actions cache entry is evicted (see that step for why this matters).
  contents: write

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      # Restored before the gate runs, so the gate can tell whether today's
      # window was already delivered by an earlier poll (or a manual dispatch)
      # before deciding whether to go again.
      - name: Restore delivery memory
        uses: actions/cache@v4
        with:
          path: |
            .telegram-sent.json
            .content-history.json
            .content-registry.json
            .daily-batch-sent.json
          key: scheduled-delivery-${{ github.run_id }}
          restore-keys: scheduled-delivery-

      - name: Check the Berlin delivery gate
        id: gate
        shell: bash
        run: |
          local_date="$(TZ=Europe/Berlin date '+%Y-%m-%d')"
          local_hm="$(TZ=Europe/Berlin date '+%H:%M')"
          echo "Berlin local time: $(TZ=Europe/Berlin date '+%Y-%m-%d %H:%M %Z')"

          already_sent() {
            [ -f .daily-batch-sent.json ] && grep -q "\"$1\"" .daily-batch-sent.json
          }

          # An explicit (non-auto) workflow_dispatch input forces that batch
          # right now, skipping the gate — a deliberate manual backfill/test,
          # not something a poll should ever send on its own.
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ "${{ inputs.batch }}" != "auto" ]; then
            echo "go=yes" >> "$GITHUB_OUTPUT"
            echo "batch=${{ inputs.batch }}" >> "$GITHUB_OUTPUT"
            echo "date=$local_date" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # Open-ended, not a narrow window: what matters is which threshold
          # has most recently passed and is not yet marked sent today, not
          # how many minutes ago it passed. A schedule tick or a
          # workflow_dispatch poll arriving 5 hours late still catches it —
          # see the note at the top of this file for why a tight window
          # cannot be relied on to ever see a poll land inside it.
          if [[ "$local_hm" > "08:30" || "$local_hm" == "08:30" ]] && ! already_sent "$local_date-morning"; then
            echo "go=yes" >> "$GITHUB_OUTPUT"
            echo "batch=morning" >> "$GITHUB_OUTPUT"
            echo "date=$local_date" >> "$GITHUB_OUTPUT"
          elif [[ "$local_hm" > "17:00" || "$local_hm" == "17:00" ]] && ! already_sent "$local_date-evening"; then
            echo "go=yes" >> "$GITHUB_OUTPUT"
            echo "batch=evening" >> "$GITHUB_OUTPUT"
            echo "date=$local_date" >> "$GITHUB_OUTPUT"
          else
            echo "go=no" >> "$GITHUB_OUTPUT"
            echo "Before today's first threshold, or today's batch(es) already delivered — skipping."
          fi

      - uses: actions/setup-node@v4
        if: steps.gate.outputs.go == 'yes'
        with:
          node-version: "22"

      - name: System packages for video rendering
        if: steps.gate.outputs.go == 'yes'
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg \
            libnss3 libatk1.0-0t64 libatk-bridge2.0-0t64 libcups2t64 libdrm2 \
            libxkbcommon0 libxcomposite1 libxdamage1 libxfixes3 libxrandr2 \
            libgbm1 libasound2t64 libpango-1.0-0 libcairo2 fonts-liberation

      - name: Produce and send the scheduled pair
        if: steps.gate.outputs.go == 'yes'
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          MINIMAX_API_KEY: ${{ secrets.MINIMAX_API_KEY }}
          MINIMAX_VOICE_ID: ${{ secrets.MINIMAX_VOICE_ID }}
          VOICE: "on"
          REQUIRE_VOICE: "on"
          # daily-render.mjs's Visual QC retry loop calls lib/auto-image.mjs's
          # rescuePackPhotos() to auto-source a real photo for a rotation
          # feature that has none (confirmed live 2026-09-06: the evening
          # ai-tiktok/ai-instagram batch failed outright on "descript" with no
          # real photo, and this step had none of these keys to even attempt
          # a rescue). Without them the rescue silently no-ops every time.
          EXA_API_KEY: ${{ secrets.EXA_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GOOGLE_API_KEY: ${{ secrets.GOOGLE_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
        shell: bash
        run: |
          case "${{ steps.gate.outputs.batch }}" in
            morning)
              # Two native delivery formats. The research topic itself is not
              # restricted to TikTok or Instagram.
              node daily-render.mjs --only tiktok
              node daily-render.mjs --only instagram
              ;;
            evening)
              # A second independently researched topic, adapted as two native
              # delivery formats; it may be any useful app, service or trend.
              node daily-render.mjs --only ai-tiktok
              node daily-render.mjs --only ai-instagram
              ;;
            all)
              node daily-render.mjs --only tiktok
              node daily-render.mjs --only instagram
              node daily-render.mjs --only ai-tiktok
              node daily-render.mjs --only ai-instagram
              ;;
            *)
              echo "Unknown batch: ${{ steps.gate.outputs.batch }}" >&2
              exit 1
              ;;
          esac

      # Marks today's batch delivered so a later poll the same day — however
      # much later — does not send it a second time.
      - name: Record delivery marker
        if: steps.gate.outputs.go == 'yes'
        shell: bash
        run: |
          case "${{ steps.gate.outputs.batch }}" in
            morning) markers=("${{ steps.gate.outputs.date }}-morning") ;;
            evening) markers=("${{ steps.gate.outputs.date }}-evening") ;;
            all) markers=("${{ steps.gate.outputs.date }}-morning" "${{ steps.gate.outputs.date }}-evening") ;;
          esac
          node -e '
            const fs = require("fs");
            let existing = [];
            try { existing = JSON.parse(fs.readFileSync(".daily-batch-sent.json", "utf8")); } catch {}
            const add = process.argv.slice(1);
            const merged = [...new Set([...existing, ...add])].slice(-60);
            fs.writeFileSync(".daily-batch-sent.json", JSON.stringify(merged, null, 2));
          ' "${markers[@]}"

      # The dedup record (.content-registry.json / .content-history.json /
      # .daily-batch-sent.json / .telegram-sent.json) previously lived ONLY in
      # the actions/cache entry restored above — never committed to the repo.
      # That cache is a real single point of failure: GitHub evicts a cache
      # entry unused for 7 days, or once the repo's total cache size passes
      # its 10GB cap (oldest first), and either one silently rewinds this
      # workflow's memory of what it already sent — the exact failure
      # lib/dedupe.mjs's own header comment already describes ("nothing
      # recorded a send made outside daily-render — today's four videos are
      # absent from the log entirely"). A viewer-reported repeat is the
      # visible symptom of that: dedupe.mjs can only skip a topic it still
      # remembers sending.
      #
      # Committing these files after every real send makes git the durable
      # source of truth (checked out fresh every run) and the cache a pure
      # speed optimization on top of it, the same pattern news-scan.yml
      # already uses for .german-lesson-progress.json.
      - name: Persist delivery memory to git
        if: steps.gate.outputs.go == 'yes'
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -f .content-history.json .content-registry.json .daily-batch-sent.json .telegram-sent.json 2>/dev/null || true
          git diff --staged --quiet || git commit -m "daily: record today's ${{ steps.gate.outputs.batch }} send(s)"
          git pull --rebase --autostash || true
          git push || true
