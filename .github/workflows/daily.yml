name: Daily topic approval

# Runs in GitHub's cloud — your PC does not need to be on.
on:
  # GitHub cron is UTC only and has no daylight-saving awareness, so 08:00 in
  # Germany is 06:00 UTC in summer (CEST) and 07:00 UTC in winter (CET). We fire
  # at BOTH and let the first step drop the run that is not actually 08:00 Berlin.
  schedule:
    - cron: "0 6 * * *"    # 08:00 Europe/Berlin while CEST is in effect
    - cron: "0 7 * * *"    # 08:00 Europe/Berlin while CET is in effect
  workflow_dispatch:
    inputs:
      weekly:
        description: "Send the weekly topic plan instead of tomorrow's shortlist."
        required: false
        default: "false"

concurrency:
  group: render
  cancel-in-progress: false

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      # Only one of the two cron slots is the real 08:00 in Berlin on any given
      # day; the other must exit quietly. Manual runs always proceed.
      - name: Is it 08:00 in Germany?
        id: gate
        run: |
          HOUR=$(TZ=Europe/Berlin date +%H)
          echo "Berlin local time: $(TZ=Europe/Berlin date '+%Y-%m-%d %H:%M %Z')"
          if [ "${{ github.event_name }}" != "schedule" ] || [ "$HOUR" = "08" ]; then
            echo "go=yes" >> "$GITHUB_OUTPUT"
          else
            echo "go=no" >> "$GITHUB_OUTPUT"
            echo "Not the 08:00 Berlin slot — skipping."
          fi

      - uses: actions/checkout@v4
        if: steps.gate.outputs.go == 'yes'

      - uses: actions/setup-node@v4
        if: steps.gate.outputs.go == 'yes'
        with:
          node-version: "22"

      - name: Send researched topics for approval
        if: steps.gate.outputs.go == 'yes'
        env:
          EXA_API_KEY: ${{ secrets.EXA_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          if [ "${{ github.event.inputs.weekly }}" = "true" ]; then
            node topic-plan.mjs --week
          elif [ "$(TZ=Europe/Berlin date +%u)" = "1" ]; then
            node topic-plan.mjs --tomorrow --week
          else
            node topic-plan.mjs --tomorrow
          fi
