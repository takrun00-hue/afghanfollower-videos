name: Daily GapMedia video delivery

# Runs in GitHub's cloud. The computer may be off. GitHub cron is UTC-only,
# therefore both CET and CEST candidates run. GitHub may begin a scheduled run
# late, so the gate keys off the scheduled cron expression rather than the
# runner's current hour.
on:
  schedule:
    # 08:30 Europe/Berlin: 06:30 UTC in CEST, 07:30 UTC in CET
    - cron: "30 6 * * *"
    - cron: "30 7 * * *"
    # 17:00 Europe/Berlin: 15:00 UTC in CEST, 16:00 UTC in CET
    - cron: "0 15 * * *"
    - cron: "0 16 * * *"
  workflow_dispatch:
    inputs:
      batch:
        description: "Which scheduled pair to produce"
        required: true
        default: "all"
        type: choice
        options:
          - morning
          - evening
          - all

# Do not cancel a morning render just because the evening trigger begins.
concurrency:
  group: gapmedia-scheduled-production
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Check the Berlin delivery window
        id: gate
        shell: bash
        run: |
          local_time="$(TZ=Europe/Berlin date '+%Y-%m-%d %H:%M %Z')"
          offset="$(TZ=Europe/Berlin date +%z)"
          schedule="${{ github.event.schedule }}"
          echo "Berlin local time: $local_time"

          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "go=yes" >> "$GITHUB_OUTPUT"
            echo "batch=${{ inputs.batch }}" >> "$GITHUB_OUTPUT"
          # GitHub's event carries the cron that caused this run even when the
          # runner starts late. Match it against the current Berlin offset so
          # exactly one of each CET/CEST pair renders.
          elif [ "$schedule" = "30 6 * * *" ] && [ "$offset" = "+0200" ]; then
            echo "go=yes" >> "$GITHUB_OUTPUT"
            echo "batch=morning" >> "$GITHUB_OUTPUT"
          elif [ "$schedule" = "30 7 * * *" ] && [ "$offset" = "+0100" ]; then
            echo "go=yes" >> "$GITHUB_OUTPUT"
            echo "batch=morning" >> "$GITHUB_OUTPUT"
          elif [ "$schedule" = "0 15 * * *" ] && [ "$offset" = "+0200" ]; then
            echo "go=yes" >> "$GITHUB_OUTPUT"
            echo "batch=evening" >> "$GITHUB_OUTPUT"
          elif [ "$schedule" = "0 16 * * *" ] && [ "$offset" = "+0100" ]; then
            echo "go=yes" >> "$GITHUB_OUTPUT"
            echo "batch=evening" >> "$GITHUB_OUTPUT"
          else
            echo "go=no" >> "$GITHUB_OUTPUT"
            echo "This cron does not match the current Berlin daylight-saving offset — skipping."
          fi

      - uses: actions/checkout@v4
        if: steps.gate.outputs.go == 'yes'

      - uses: actions/setup-node@v4
        if: steps.gate.outputs.go == 'yes'
        with:
          node-version: "22"

      # Keep delivery and editorial memory between cloud runs to prevent a
      # successfully sent topic being treated as unseen later.
      - name: Restore delivery memory
        if: steps.gate.outputs.go == 'yes'
        uses: actions/cache@v4
        with:
          path: |
            .telegram-sent.json
            .content-history.json
            .content-registry.json
          key: scheduled-delivery-${{ github.run_id }}
          restore-keys: scheduled-delivery-

      - name: System packages for video rendering
        if: steps.gate.outputs.go == 'yes'
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg \
            libnss3 libatk1.0-0t64 libatk-bridge2.0-0t64 libcups2t64 libdrm2 \
            libxkbcommon0 libxcomposite1 libxdamage1 libxfixes3 libxrandr2 \
            libgbm1 libasound2t64 libpango-1.0-0 libcairo2 fonts-liberation

      - name: Produce and send the scheduled pair
        if: steps.gate.outputs.go == 'yes'
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          MINIMAX_API_KEY: ${{ secrets.MINIMAX_API_KEY }}
          MINIMAX_VOICE_ID: ${{ secrets.MINIMAX_VOICE_ID }}
          VOICE: "on"
          REQUIRE_VOICE: "on"
        shell: bash
        run: |
          case "${{ steps.gate.outputs.batch }}" in
            morning)
              # Two native delivery formats. The research topic itself is not
              # restricted to TikTok or Instagram.
              node daily-render.mjs --only tiktok
              node daily-render.mjs --only instagram
              ;;
            evening)
              # A second independently researched topic, adapted as two native
              # delivery formats; it may be any useful app, service or trend.
              node daily-render.mjs --only ai-tiktok
              node daily-render.mjs --only ai-instagram
              ;;
            all)
              node daily-render.mjs --only tiktok
              node daily-render.mjs --only instagram
              node daily-render.mjs --only ai-tiktok
              node daily-render.mjs --only ai-instagram
              ;;
            *)
              echo "Unknown batch: ${{ steps.gate.outputs.batch }}" >&2
              exit 1
              ;;
          esac
