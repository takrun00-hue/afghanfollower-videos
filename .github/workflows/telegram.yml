name: Telegram video runner

# Receives explicit render jobs from the real-time Telegram Worker and acts in
# the cloud — so videos can be ordered from the phone with the PC switched off.
#
# Every action the command parser can return must be handled here. It was not:
# after the news commands were added, an earlier listener returned actions like
# "news-germany" and this workflow passed them to `--only`, which is a category
# flag. Twelve runs in a row failed on "unknown category" before anyone looked.
on:
  push:
    paths:
      - ".video-request.json"
  # No Cloudflare Worker is deployed for this bot right now, so nothing else
  # reads new Telegram messages. This polls instead: every 5 minutes it asks
  # Telegram for updates since the last run (cloud-listen.mjs, the same path
  # workflow_dispatch falls back to below) and acts on the newest command.
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:
    inputs:
      run_news_now:
        description: "Build one current short news video now"
        required: false
        default: false
        type: boolean
      action:
        description: "Command sent by the real-time Telegram Worker"
        required: false
        default: ""
        type: string
      pick:
        description: "Approved news item number"
        required: false
        default: "1"
        type: string
      payload:
        description: "Sanitized feature id or user-supplied news text"
        required: false
        default: ""
        type: string
      voice_id:
        description: "Optional MiniMax voice ID selected in Telegram"
        required: false
        default: ""
        type: string
      voice_mode:
        description: "on by default; off only when a Telegram order asks for it"
        required: false
        default: "on"
        type: string

concurrency:
  group: telegram-listen
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  manual-news:
    if: inputs.run_news_now == true
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: System packages (ffmpeg + headless Chrome libs)
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg \
            libnss3 libatk1.0-0t64 libatk-bridge2.0-0t64 libcups2t64 libdrm2 \
            libxkbcommon0 libxcomposite1 libxdamage1 libxfixes3 libxrandr2 \
            libgbm1 libasound2t64 libpango-1.0-0 libcairo2 fonts-liberation
      - name: Build one current short news video
        env:
          EXA_API_KEY: ${{ secrets.EXA_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          PAYLOAD: ${{ steps.cmd.outputs.PAYLOAD }}
          MINIMAX_API_KEY: ${{ secrets.MINIMAX_API_KEY }}
          MINIMAX_VOICE_ID: ${{ secrets.MINIMAX_VOICE_ID }}
          VOICE: "on"
          REQUIRE_VOICE: "on"
        run: node news-build.mjs --fetch --today

  listen:
    if: inputs.run_news_now != true
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      # remembers the last message id so one order never runs twice
      - name: Restore command cursor
        uses: actions/cache@v4
        with:
          # Cache the confirmed Telegram delivery history beside the update
          # cursor. Each run has its own key and restores the most recent
          # prior state, so no repository-wide write permission is needed.
          path: |
            .telegram-offset
            .content-history.json
            .content-search-queue.json
            # These are short-lived editorial state files.  Persisting them in
            # the Actions cache avoids requiring `contents: write` just to
            # move from a Telegram preview to an approval.
            .content-draft.json
            # Repeat suppression lives in these two. Without them in the
            # cache each run starts blank: nothing remembers what was
            # offered yesterday or sent today, and the same topic comes
            # back — which is what it did.
            .topic-proposals.json
            .topic-rejected.json
            .topic-offered.json
            .content-search-offered.json
            .content-search-backlog.json
            .content-registry.json
            .news-draft.json
            .news-queue.json
            .news-seen.json
            .content-radar.json
          key: tg-offset-${{ github.run_id }}
          restore-keys: tg-offset-

      - name: Read commands
        id: cmd
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          INPUT_ACTION: ${{ inputs.action }}
          INPUT_PICK: ${{ inputs.pick }}
          INPUT_PAYLOAD: ${{ inputs.payload }}
          INPUT_VOICE_ID: ${{ inputs.voice_id }}
          INPUT_VOICE_MODE: ${{ inputs.voice_mode }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          if [ "$EVENT_NAME" = "push" ] && [ -f .video-request.json ]; then
            request_action=$(jq -r '.action // "none"' .video-request.json)
            request_payload=$(jq -r '.payload // ""' .video-request.json | tr '\r\n' ' ' | cut -c1-900)
            request_voice=$(jq -r '.voice_mode // "on"' .video-request.json)
            case "$request_action" in custom-content) ;; *) request_action="none" ;; esac
            case "$request_voice" in on|off) ;; *) request_voice="on" ;; esac
            printf 'ACTION=%s\nPICK=1\nPAYLOAD=%s\nVOICE_ID=\nVOICE_MODE=%s\n' "$request_action" "$request_payload" "$request_voice" >> "$GITHUB_OUTPUT"
          elif [ -n "$INPUT_ACTION" ]; then
            case "$INPUT_ACTION" in
              approved-feature|approved-screen|topic-pick|topic-reject|topic-unreject|topic-rejected-list|search-topic-pick|content-preview|content-edit-hook|content-edit-steps|content-approve|content-source-pick|content-topic-preview|build-tiktok|build-instagram|build-tools|build-all|build-tomorrow|resend|research|content-radar|news-radar|demand-research|content-search|content-search-live|custom-content|custom-content-media|voice-list|news-scan|news-search-live|news-source-pick|news-germany|news-europe|news-today|news-breaking|news-pick|europe-pick|news-text|news-approve|news-breaking-preview|news-pick-preview|europe-pick-preview|news-text-preview|news-edit-hook|news-edit-text|news-approve-draft|undo|undo-news|plan-today|plan-tomorrow|plan-week|plan-tiktok|plan-instagram|plan-tools|amal-berlin|amal-hamburg|amal-frankfurt|amal-farsi) ;;
              *) echo "ACTION=none" >> "$GITHUB_OUTPUT"; exit 0 ;;
            esac
            safe_pick=$(printf '%s' "$INPUT_PICK" | tr -cd '0-9' | cut -c1-1)
            safe_payload=$(printf '%s' "$INPUT_PAYLOAD" | tr '\r\n' ' ' | cut -c1-900)
            safe_voice=$(printf '%s' "$INPUT_VOICE_ID" | tr -cd 'A-Za-z0-9_.-' | cut -c1-120)
            case "$INPUT_VOICE_MODE" in on|off) safe_voice_mode="$INPUT_VOICE_MODE" ;; *) safe_voice_mode="on" ;; esac
            printf 'ACTION=%s\nPICK=%s\nPAYLOAD=%s\nVOICE_ID=%s\nVOICE_MODE=%s\n' "$INPUT_ACTION" "${safe_pick:-1}" "$safe_payload" "$safe_voice" "$safe_voice_mode" >> "$GITHUB_OUTPUT"
          else
            node cloud-listen.mjs | tee -a "$GITHUB_OUTPUT"
          fi
      # Only the actions that actually render a video need ffmpeg and a headless
      # browser. Listing news or deleting a message does not.
      - name: System packages (ffmpeg + headless Chrome libs)
        if: contains(fromJSON('["approved-feature","content-approve","build-tiktok","build-instagram","build-tools","build-all","build-tomorrow","resend","custom-content","custom-content-media","news-breaking","news-pick","europe-pick","news-text","news-approve","news-approve-draft"]'), steps.cmd.outputs.ACTION)
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg \
            libnss3 libatk1.0-0t64 libatk-bridge2.0-0t64 libcups2t64 libdrm2 \
            libxkbcommon0 libxcomposite1 libxdamage1 libxfixes3 libxrandr2 \
            libgbm1 libasound2t64 libpango-1.0-0 libcairo2 fonts-liberation

      # ---- tutorials -------------------------------------------------------
      - name: Send the fixed daily/weekly schedule for approval
        if: contains(fromJSON('["plan-today","plan-tomorrow","plan-week","plan-tiktok","plan-instagram","plan-tools"]'), steps.cmd.outputs.ACTION)
        env:
          EXA_API_KEY: ${{ secrets.EXA_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GOOGLE_API_KEY: ${{ secrets.GOOGLE_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          case "${{ steps.cmd.outputs.ACTION }}" in
            plan-today)     node topic-plan.mjs --today ;;
            plan-week)      node topic-plan.mjs --week ;;
            plan-tiktok)    node topic-plan.mjs --tomorrow --category=tiktok ;;
            plan-instagram) node topic-plan.mjs --tomorrow --category=instagram ;;
            plan-tools)     node topic-plan.mjs --tomorrow --category=tools ;;
            *)              node topic-plan.mjs --tomorrow ;;
          esac

      # «جستجوی محتوا» (bare) and «جستجوی جدید: X» — the live-search-first
      # discovery engine from the 2026-09-03 content-search rules. Deliberately
      # a separate script from topic-plan.mjs above: that one proposes from the
      # fixed catalogue for the daily/weekly schedule, this one searches live,
      # scores three lanes (income/reach/trend) and reports 5+ real, dated,
      # gated topics every time.
      - name: Live content-search discovery
        if: contains(fromJSON('["content-search","content-search-live"]'), steps.cmd.outputs.ACTION)
        env:
          EXA_API_KEY: ${{ secrets.EXA_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GOOGLE_API_KEY: ${{ secrets.GOOGLE_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          PAYLOAD: ${{ steps.cmd.outputs.PAYLOAD }}
        run: |
          case "${{ steps.cmd.outputs.ACTION }}" in
            content-search-live) node content-search.mjs --query "$PAYLOAD" ;;
            *)                   node content-search.mjs ;;
          esac

      # A bare "۱".."۵" after content-search — routed here by the Worker's own
      # selection-kind check (worker/src/index.js bareTopicPick), not by any
      # allowlist gymnastics here. Builds ONLY a draft (rule 8), never a video.
      - name: Build a draft from a picked content-search topic
        if: steps.cmd.outputs.ACTION == 'search-topic-pick'
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          PICK: ${{ steps.cmd.outputs.PICK }}
        run: node content-search.mjs --pick "${PICK:-1}"

      - name: Verify content-search draft for cache
        if: steps.cmd.outputs.ACTION == 'search-topic-pick'
        # A missing file here isn't always a real fault: content-search.mjs's
        # own replyOnFailure() already sends the operator a clear Telegram
        # message and exits 0 when the picked number was invalid/stale — that
        # is a correct, graceful decline, not something this step should turn
        # into a red X. A genuine crash still fails earlier steps normally.
        run: |
          if [ -f .content-draft.json ]; then
            echo "content-search draft will be retained by the Actions cache."
          else
            echo "::warning::No draft file — the previous step likely already explained why in Telegram."
          fi

      - name: Build a requested tutorial
        if: contains(fromJSON('["approved-feature","content-approve","build-tiktok","build-instagram","build-tools","build-all","build-tomorrow","resend","custom-content","custom-content-media"]'), steps.cmd.outputs.ACTION)
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          PAYLOAD: ${{ steps.cmd.outputs.PAYLOAD }}
          PICK: ${{ steps.cmd.outputs.PICK }}
          MINIMAX_API_KEY: ${{ secrets.MINIMAX_API_KEY }}
          MINIMAX_VOICE_ID: ${{ steps.cmd.outputs.VOICE_ID || secrets.MINIMAX_VOICE_ID }}
          VOICE_MODE: ${{ steps.cmd.outputs.VOICE_MODE }}
        run: |
          if [ "$VOICE_MODE" = "off" ]; then export VOICE="off" REQUIRE_VOICE="off"; else export VOICE="on" REQUIRE_VOICE="on"; fi
          case "${{ steps.cmd.outputs.ACTION }}" in
            approved-feature) node approve-feature.mjs "$PAYLOAD" ;;
            content-approve)  node content-draft.mjs --build ;;
            custom-content|custom-content-media) node custom-content.mjs "$PAYLOAD" ;;
            build-instagram)  node daily-render.mjs --only instagram ;;
            build-tools)      node daily-render.mjs --only ai-tiktok ;;
            build-all|resend) node daily-render.mjs ;;
            build-tomorrow)   TZ=Europe/Berlin node daily-render.mjs "$(TZ=Europe/Berlin date -d tomorrow +%F)" ;;
            *)                node daily-render.mjs --only tiktok ;;
          esac

      - name: Preview or edit tutorial draft
        if: contains(fromJSON('["topic-pick","content-preview","content-edit-hook","content-edit-steps"]'), steps.cmd.outputs.ACTION)
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          PICK: ${{ steps.cmd.outputs.PICK }}
          PAYLOAD: ${{ steps.cmd.outputs.PAYLOAD }}
        run: |
          case "${{ steps.cmd.outputs.ACTION }}" in
            topic-pick)          node topic-plan.mjs --preview "${PICK:-1}" ;;
            content-edit-hook)   node content-draft.mjs --edit-hook "$PAYLOAD" ;;
            content-edit-steps)  node content-draft.mjs --edit-steps "$PAYLOAD" ;;
            *)                   node content-draft.mjs --preview ;;
          esac

      - name: Preview selected content source
        if: steps.cmd.outputs.ACTION == 'content-source-pick'
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          PICK: ${{ steps.cmd.outputs.PICK }}
        run: node source-draft.mjs "${PICK:-1}"

      - name: Analyse creator-supplied tutorial topic
        if: steps.cmd.outputs.ACTION == 'content-topic-preview'
        env:
          # A raw creator topic is expanded into a reviewable draft only.  It
          # never reaches the renderer until the separate content-approve action.
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GOOGLE_API_KEY: ${{ secrets.GOOGLE_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          PAYLOAD: ${{ steps.cmd.outputs.PAYLOAD }}
        run: node custom-draft.mjs "$PAYLOAD"

      - name: Verify tutorial draft for cache
        if: contains(fromJSON('["topic-pick","content-edit-hook","content-edit-steps"]'), steps.cmd.outputs.ACTION)
        # A missing file isn't always a real fault: content-draft.mjs's own
        # replyOnFailure() sends a clear Telegram explanation and exits 0
        # when the picked topic id is invalid/stale (e.g. an offer cached
        # from an earlier run) — a correct decline, not a red X here.
        run: |
          if [ -f .content-draft.json ]; then
            echo "Tutorial draft will be retained by the Actions cache."
          else
            echo "::warning::No draft file — the previous step likely already explained why in Telegram."
          fi

      # ---- real screenshot / broll approval --------------------------------
      # fetch-screens.mjs / fetch-broll.mjs only ever run ahead of time (local
      # or a manual dispatch), never as part of a render — "a person looks" is
      # this step: approve-screen.mjs marks one candidate verified on
      # "تأیید تصویر <id> <شماره>" from Telegram, and content.mjs's
      # verifiedScreenFor() picks it up automatically on the next render.
      # candidates.json is real git-tracked data (not ephemeral state), so the
      # change is committed back the same way news-scan.yml commits its queue
      # — the Actions cache above is for short-lived editorial state only.
      - name: Approve a real screenshot candidate
        if: steps.cmd.outputs.ACTION == 'approved-screen'
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          PAYLOAD: ${{ steps.cmd.outputs.PAYLOAD }}
        run: |
          node approve-screen.mjs "$PAYLOAD"
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -f public/screens/candidates.json 2>/dev/null || true
          git diff --staged --quiet || git commit -m "screens: approve candidate from Telegram"
          git pull --rebase --autostash || true
          git push || true

      - name: Research digest
        if: steps.cmd.outputs.ACTION == 'research'
        env:
          EXA_API_KEY: ${{ secrets.EXA_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: node research.mjs

      - name: Content radar — daily scored shortlist
        if: steps.cmd.outputs.ACTION == 'content-radar'
        env:
          EXA_API_KEY: ${{ secrets.EXA_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: node content-radar.mjs

      - name: News radar — newsworthiness-ranked shortlist
        if: steps.cmd.outputs.ACTION == 'news-radar'
        env:
          EXA_API_KEY: ${{ secrets.EXA_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: node news-radar.mjs

      - name: Verify news radar queue for cache
        if: steps.cmd.outputs.ACTION == 'news-radar'
        # Missing files here aren't always a real fault: news-radar.mjs exits
        # before writing either file when it genuinely finds nothing new —
        # an expected, common outcome, not something to red-flag the job for.
        run: |
          if [ -f .news-queue.json ] && [ -f .news-seen.json ]; then
            echo "News radar queue and duplicate guard will be retained by the Actions cache."
          else
            echo "::warning::No queue/seen file — likely just no new stories this run."
          fi

      - name: Send MiniMax voice IDs
        if: steps.cmd.outputs.ACTION == 'voice-list'
        env:
          MINIMAX_API_KEY: ${{ secrets.MINIMAX_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: node music/minimax-voices.mjs --telegram

      # ---- news channel ----------------------------------------------------
      - name: Scan for new stories now
        if: contains(fromJSON('["news-scan","news-search-live","amal-berlin","amal-hamburg","amal-frankfurt","amal-farsi"]'), steps.cmd.outputs.ACTION)
        env:
          EXA_API_KEY: ${{ secrets.EXA_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          PAYLOAD: ${{ steps.cmd.outputs.PAYLOAD }}
        run: |
          if [ "${{ steps.cmd.outputs.ACTION }}" = "amal-berlin" ]; then
            node news-scan.mjs --amal berlin
          elif [ "${{ steps.cmd.outputs.ACTION }}" = "amal-hamburg" ]; then
            node news-scan.mjs --amal hamburg
          elif [ "${{ steps.cmd.outputs.ACTION }}" = "amal-frankfurt" ]; then
            node news-scan.mjs --amal frankfurt
          elif [ "${{ steps.cmd.outputs.ACTION }}" = "amal-farsi" ]; then
            node news-scan.mjs --amal farsi
          elif [ "${{ steps.cmd.outputs.ACTION }}" = "news-search-live" ]; then
            node news-scan.mjs --query "$PAYLOAD"
          else
            node news-scan.mjs
          fi

      - name: Verify news queue for cache
        if: contains(fromJSON('["news-scan","news-search-live","amal-berlin","amal-hamburg","amal-frankfurt","amal-farsi"]'), steps.cmd.outputs.ACTION)
        # Missing files here aren't always a real fault: news-scan.mjs exits
        # before writing either file when it genuinely finds nothing new —
        # an expected, common outcome, not something to red-flag the job for.
        run: |
          if [ -f .news-queue.json ] && [ -f .news-seen.json ]; then
            echo "News queue and duplicate guard will be retained by the Actions cache."
          else
            echo "::warning::No queue/seen file — likely just no new stories this run."
          fi

      - name: List news
        if: contains(fromJSON('["news-germany","news-europe","news-today"]'), steps.cmd.outputs.ACTION)
        env:
          EXA_API_KEY: ${{ secrets.EXA_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          case "${{ steps.cmd.outputs.ACTION }}" in
            news-europe) node news-build.mjs --fetch --list --europe ;;
            news-today)  node news-build.mjs --fetch --list --today ;;
            *)           node news-build.mjs --fetch --list ;;
          esac

      - name: Build a news video
        if: contains(fromJSON('["news-breaking","news-pick","europe-pick","news-text","news-approve","news-approve-draft"]'), steps.cmd.outputs.ACTION)
        env:
          EXA_API_KEY: ${{ secrets.EXA_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          MINIMAX_API_KEY: ${{ secrets.MINIMAX_API_KEY }}
          MINIMAX_VOICE_ID: ${{ secrets.MINIMAX_VOICE_ID }}
          VOICE: "on"
          REQUIRE_VOICE: "on"
          PICK: ${{ steps.cmd.outputs.PICK }}
          PAYLOAD: ${{ steps.cmd.outputs.PAYLOAD }}
        run: |
          case "${{ steps.cmd.outputs.ACTION }}" in
            news-pick)   node news-build.mjs --fetch --pick "${PICK:-1}" ;;
            europe-pick) node news-build.mjs --fetch --europe --pick "${PICK:-1}" ;;
            news-approve) node news-build.mjs --from-queue "${PICK:-1}" ;;
            news-approve-draft) node news-draft.mjs --build ;;
            news-text)   node news-build.mjs --text "$PAYLOAD" ;;
            *)           node news-build.mjs --fetch ;;
          esac

      - name: Preview or edit news draft
        if: contains(fromJSON('["news-breaking-preview","news-pick-preview","europe-pick-preview","news-text-preview","news-edit-hook","news-edit-text"]'), steps.cmd.outputs.ACTION)
        env:
          EXA_API_KEY: ${{ secrets.EXA_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          PAYLOAD: ${{ steps.cmd.outputs.PAYLOAD }}
          PICK: ${{ steps.cmd.outputs.PICK }}
        run: |
          case "${{ steps.cmd.outputs.ACTION }}" in
            news-pick-preview)   node news-build.mjs --fetch --pick "${PICK:-1}" --preview ;;
            europe-pick-preview) node news-build.mjs --fetch --europe --pick "${PICK:-1}" --preview ;;
            news-text-preview)   node news-build.mjs --text "$PAYLOAD" --preview ;;
            news-edit-hook)      node news-draft.mjs --edit-hook "$PAYLOAD" ;;
            news-edit-text)      node news-draft.mjs --edit-text "$PAYLOAD" ;;
            *)                   node news-build.mjs --fetch --preview ;;
          esac

      - name: Real search demand for a topic
        if: steps.cmd.outputs.ACTION == 'demand-research'
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          PAYLOAD: ${{ steps.cmd.outputs.PAYLOAD }}
        run: node demand.mjs "$PAYLOAD"

      - name: Reject or restore a topic
        if: contains(fromJSON('["topic-reject","topic-unreject","topic-rejected-list"]'), steps.cmd.outputs.ACTION)
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          PAYLOAD: ${{ steps.cmd.outputs.PAYLOAD }}
          PICK: ${{ steps.cmd.outputs.PICK }}
        run: |
          case "${{ steps.cmd.outputs.ACTION }}" in
            topic-reject)        node reject-topic.mjs "${PAYLOAD:-${PICK:-1}}" ;;
            topic-unreject)      node reject-topic.mjs --undo "$PAYLOAD" ;;
            topic-rejected-list) node reject-topic.mjs --list ;;
          esac

      - name: Preview selected news source
        if: steps.cmd.outputs.ACTION == 'news-source-pick'
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          PICK: ${{ steps.cmd.outputs.PICK }}
        run: node news-build.mjs --from-queue "${PICK:-1}" --preview

      - name: Verify news draft for cache
        if: contains(fromJSON('["news-breaking-preview","news-pick-preview","europe-pick-preview","news-text-preview","news-edit-hook","news-edit-text"]'), steps.cmd.outputs.ACTION)
        # A missing file isn't always a real fault — the previous step may
        # have already sent a clear Telegram explanation and exited 0.
        run: |
          if [ -f .news-draft.json ]; then
            echo "News draft will be retained by the Actions cache."
          else
            echo "::warning::No draft file — the previous step likely already explained why in Telegram."
          fi

      # ---- deleting --------------------------------------------------------
      - name: Undo the last send
        if: contains(fromJSON('["undo","undo-news"]'), steps.cmd.outputs.ACTION)
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          if [ "${{ steps.cmd.outputs.ACTION }}" = "undo-news" ]; then
            node undo-send.mjs 1 --news
          else
            node undo-send.mjs 3 --daily
          fi
