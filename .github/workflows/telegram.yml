name: Telegram video runner

# Receives explicit render jobs from the real-time Telegram Worker and acts in
# the cloud — so videos can be ordered from the phone with the PC switched off.
#
# Every action the command parser can return must be handled here. It was not:
# after the news commands were added, an earlier listener returned actions like
# "news-germany" and this workflow passed them to `--only`, which is a category
# flag. Twelve runs in a row failed on "unknown category" before anyone looked.
on:
  workflow_dispatch:
    inputs:
      run_news_now:
        description: "Build one current short news video now"
        required: false
        default: false
        type: boolean
      action:
        description: "Command sent by the real-time Telegram Worker"
        required: false
        default: ""
        type: string
      pick:
        description: "Approved news item number"
        required: false
        default: "1"
        type: string
      payload:
        description: "Sanitized feature id or user-supplied news text"
        required: false
        default: ""
        type: string

concurrency:
  group: telegram-listen
  cancel-in-progress: false

jobs:
  manual-news:
    if: inputs.run_news_now == true
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: System packages (ffmpeg + headless Chrome libs)
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg \
            libnss3 libatk1.0-0t64 libatk-bridge2.0-0t64 libcups2t64 libdrm2 \
            libxkbcommon0 libxcomposite1 libxdamage1 libxfixes3 libxrandr2 \
            libgbm1 libasound2t64 libpango-1.0-0 libcairo2 fonts-liberation
      - name: Build one current short news video
        env:
          EXA_API_KEY: ${{ secrets.EXA_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          MINIMAX_API_KEY: ${{ secrets.MINIMAX_API_KEY }}
          MINIMAX_VOICE_ID: ${{ secrets.MINIMAX_VOICE_ID }}
          VOICE: "on"
          REQUIRE_VOICE: "on"
        run: node news-build.mjs --fetch --today

  listen:
    if: inputs.run_news_now != true
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      # remembers the last message id so one order never runs twice
      - name: Restore command cursor
        uses: actions/cache@v4
        with:
          path: .telegram-offset
          key: tg-offset-${{ github.run_id }}
          restore-keys: tg-offset-

      - name: Read commands
        id: cmd
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          INPUT_ACTION: ${{ inputs.action }}
          INPUT_PICK: ${{ inputs.pick }}
          INPUT_PAYLOAD: ${{ inputs.payload }}
        run: |
          # The real-time Worker dispatches known actions. Keep this allow-list
          # here too: untrusted Telegram text must never become a shell value.
          if [ -n "$INPUT_ACTION" ]; then
            case "$INPUT_ACTION" in
              approved-feature|build-tiktok|build-instagram|build-tools|build-all|build-tomorrow|resend|research|voice-list|news-scan|news-germany|news-europe|news-today|news-breaking|news-pick|europe-pick|news-text|news-approve|undo|undo-news|plan-tomorrow|plan-week|plan-tiktok|plan-instagram|plan-tools) ;;
              *) echo "ACTION=none" >> "$GITHUB_OUTPUT"; exit 0 ;;
            esac
            safe_pick=$(printf '%s' "$INPUT_PICK" | tr -cd '0-9' | cut -c1-1)
            safe_payload=$(printf '%s' "$INPUT_PAYLOAD" | tr '\r\n' ' ' | cut -c1-900)
            printf 'ACTION=%s\nPICK=%s\nPAYLOAD=%s\n' "$INPUT_ACTION" "${safe_pick:-1}" "$safe_payload" >> "$GITHUB_OUTPUT"
          else
            # There is no polling in the production Worker architecture. This
            # fallback is only for manually running the old listener while
            # migrating an existing bot.
            node cloud-listen.mjs | tee -a "$GITHUB_OUTPUT"
          fi

      # Only the actions that actually render a video need ffmpeg and a headless
      # browser. Listing news or deleting a message does not.
      - name: System packages (ffmpeg + headless Chrome libs)
        if: contains(fromJSON('["approved-feature","build-tiktok","build-instagram","build-tools","build-all","build-tomorrow","resend","news-breaking","news-pick","europe-pick","news-text","news-approve"]'), steps.cmd.outputs.ACTION)
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg \
            libnss3 libatk1.0-0t64 libatk-bridge2.0-0t64 libcups2t64 libdrm2 \
            libxkbcommon0 libxcomposite1 libxdamage1 libxfixes3 libxrandr2 \
            libgbm1 libasound2t64 libpango-1.0-0 libcairo2 fonts-liberation

      # ---- tutorials -------------------------------------------------------
      - name: Send tutorial topics for approval
        if: contains(fromJSON('["plan-tomorrow","plan-week","plan-tiktok","plan-instagram","plan-tools"]'), steps.cmd.outputs.ACTION)
        env:
          EXA_API_KEY: ${{ secrets.EXA_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          case "${{ steps.cmd.outputs.ACTION }}" in
            plan-week)      node topic-plan.mjs --week ;;
            plan-tiktok)    node topic-plan.mjs --tomorrow --category=tiktok ;;
            plan-instagram) node topic-plan.mjs --tomorrow --category=instagram ;;
            plan-tools)     node topic-plan.mjs --tomorrow --category=tools ;;
            *)              node topic-plan.mjs --tomorrow ;;
          esac

      - name: Build a requested tutorial
        if: contains(fromJSON('["approved-feature","build-tiktok","build-instagram","build-tools","build-all","build-tomorrow","resend"]'), steps.cmd.outputs.ACTION)
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          PAYLOAD: ${{ steps.cmd.outputs.PAYLOAD }}
          MINIMAX_API_KEY: ${{ secrets.MINIMAX_API_KEY }}
          MINIMAX_VOICE_ID: ${{ secrets.MINIMAX_VOICE_ID }}
          VOICE: "on"
          REQUIRE_VOICE: "on"
        run: |
          case "${{ steps.cmd.outputs.ACTION }}" in
            approved-feature) node approve-feature.mjs "$PAYLOAD" ;;
            build-instagram)  node daily-render.mjs --only instagram ;;
            build-tools)      node daily-render.mjs --only tools ;;
            build-all|resend) node daily-render.mjs ;;
            build-tomorrow)   TZ=Europe/Berlin node daily-render.mjs "$(TZ=Europe/Berlin date -d tomorrow +%F)" ;;
            *)                node daily-render.mjs --only tiktok ;;
          esac

      - name: Research digest
        if: steps.cmd.outputs.ACTION == 'research'
        env:
          EXA_API_KEY: ${{ secrets.EXA_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: node research.mjs

      - name: Send MiniMax voice IDs
        if: steps.cmd.outputs.ACTION == 'voice-list'
        env:
          MINIMAX_API_KEY: ${{ secrets.MINIMAX_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: node music/minimax-voices.mjs --telegram

      # ---- news channel ----------------------------------------------------
      - name: Scan for new stories now
        if: steps.cmd.outputs.ACTION == 'news-scan'
        env:
          EXA_API_KEY: ${{ secrets.EXA_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: node news-scan.mjs

      - name: Commit the news queue
        if: steps.cmd.outputs.ACTION == 'news-scan'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -f .news-queue.json .news-seen.json 2>/dev/null || true
          git diff --staged --quiet || git commit -m "news: queue from manual scan"
          git push || true

      - name: List news
        if: contains(fromJSON('["news-germany","news-europe","news-today"]'), steps.cmd.outputs.ACTION)
        env:
          EXA_API_KEY: ${{ secrets.EXA_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          case "${{ steps.cmd.outputs.ACTION }}" in
            news-europe) node news-build.mjs --fetch --list --europe ;;
            news-today)  node news-build.mjs --fetch --list --today ;;
            *)           node news-build.mjs --fetch --list ;;
          esac

      - name: Build a news video
        if: contains(fromJSON('["news-breaking","news-pick","europe-pick","news-text","news-approve"]'), steps.cmd.outputs.ACTION)
        env:
          EXA_API_KEY: ${{ secrets.EXA_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          MINIMAX_API_KEY: ${{ secrets.MINIMAX_API_KEY }}
          MINIMAX_VOICE_ID: ${{ secrets.MINIMAX_VOICE_ID }}
          VOICE: "on"
          REQUIRE_VOICE: "on"
          PICK: ${{ steps.cmd.outputs.PICK }}
          PAYLOAD: ${{ steps.cmd.outputs.PAYLOAD }}
        run: |
          case "${{ steps.cmd.outputs.ACTION }}" in
            news-pick)   node news-build.mjs --fetch --pick "${PICK:-1}" ;;
            europe-pick) node news-build.mjs --fetch --europe --pick "${PICK:-1}" ;;
            news-approve) node news-build.mjs --from-queue "${PICK:-1}" ;;
            news-text)   node news-build.mjs --text "$PAYLOAD" ;;
            *)           node news-build.mjs --fetch ;;
          esac

      # ---- deleting --------------------------------------------------------
      - name: Undo the last send
        if: contains(fromJSON('["undo","undo-news"]'), steps.cmd.outputs.ACTION)
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          if [ "${{ steps.cmd.outputs.ACTION }}" = "undo-news" ]; then
            node undo-send.mjs 1 --news
          else
            node undo-send.mjs 3 --daily
          fi
